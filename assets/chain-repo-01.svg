,48.0 410.1,32.0 424.0,24.0" fill="none" stroke="#2dd4bf" stroke-width="2"/><polygon points="430.9,36.0 430.9,44.0 424.0,48.0 417.1,44.0 417.1,36.0 424.0,32.0" fill="#2dd4bf" opacity=".85"/><text x="28" y="82" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc">MediChain</text><text x="28" y="104" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2dd4bf">On-chain medicine supply chain</text><text x="28" y="132" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#cbd5e1">Every medicine batch is registered on-chain by the</text><text x="28" y="149" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#cbd5e1">manufacturer. Each handoff, from manufacturer to distributor</text><text x="28" y="166" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#cbd5e1">to pharmacy, is a signed on-chain transaction. IoT temperature</text><text x="28" y="183" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#cbd5e1">sensors log cold-chain data on-chain. The patient scans the</text><text x="28" y="200" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#cbd5e1">medicine&#x27;s QR code and sees the verified chain of custody and</text><text x="28" y="217" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#cbd5e1">temperature log.</text><rect x="28" y="238" width="73" height="22" rx="11" fill="#0d1330" stroke="#2dd4bf" stroke-opacity=".55"/><text x="65" y="253" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#e2e8f0">On-chain</text><rect x="109" y="238" width="39" height="22" rx="11" fill="#0d1330" stroke="#2dd4bf" stroke-opacity=".55"/><text x="129" y="253" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#e2e8f0">IoT</text><rect x="156" y="238" width="87" height="22" rx="11" fill="#0d1330" stroke="#2dd4bf" stroke-opacity=".55"/><text x="199" y="253" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#e2e8f0">Cold-chain</text><rect x="251" y="238" width="80" height="22" rx="11" fill="#0d1330" stroke="#2dd4bf" stroke-opacity=".55"/><text x="291" y="253" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#e2e8f0">QR verify</text><text x="28" y="297" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#64748b">github.com/Build-With-MTT/medichain</text><rect x="265" y="280" width="175" height="26" rx="13" fill="#2dd4bf"/><text x="353" y="297.5" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0b0f1f">View repo on GitHub</text></svg>