name: Update Solar System

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # "Run workflow" button
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-solar-system.yml'

permissions:
  contents: write

concurrency:
  group: solar-system
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch live GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_data.py

      - name: Generate Solar System SVGs
        run: python scripts/generate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets scripts/data.json
          git diff --staged --quiet || git commit -m "chore: update Solar System [skip ci]"
          git push
